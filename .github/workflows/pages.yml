name: Deploy Signal Yard
on:
  push:
    branches: [main]
    paths:
      - 'signal-yard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: signal-yard-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node --test signal-yard/tests/combat.test.mjs
      - run: node --check signal-yard/sw.js
      - name: Stage only the playable app
        run: |
          mkdir -p pages
          cp signal-yard/{index.html,client.mjs,manifest.webmanifest,sw.js,release.js,icon-192.png,icon-512.png} pages/
          cp -r signal-yard/shared pages/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deployment
