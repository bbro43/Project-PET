<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15131c">
<link rel="manifest" href="./manifest.webmanifest">
<title>Signal Yard</title>
<style>
* { box-sizing: border-box }
body { margin: auto; padding: 1rem; max-width: 62rem; background: #15131c; color: #f3eaf7; font: 16px system-ui; }
[hidden] { display: none !important; }
h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
form, footer, .actions, .directions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
footer { justify-content: space-between; padding-top: .5rem; }
canvas { display: block; width: 100%; max-height: 52vh; object-fit: contain; background: #201c2a; margin-top: .75rem; }
select, button { min-height: 44px; background: #342842; color: inherit; border: 1px solid #957caa; border-radius: .5rem; padding: 0 .75rem; font: inherit; }
footer button, canvas { touch-action: none; user-select: none; }
button[data-held] { background: #795695; }
#status { min-height: 1.5rem; margin: .5rem 0 0; }
small { color: #d4c7df; }
@media(max-height: 430px) and (orientation: landscape) {
  body { padding: .4rem; }
  h1 { display: none; }

  canvas { margin-top: .3rem; max-height: calc(100dvh - 145px); }
}
</style>
<main>
  <h1>Signal Yard</h1>
  <button type="button" id="install-app" hidden>Install app</button>
  <form>
    <label>Pilot <select id="pilot"><option value="relay">Relay</option><option value="coil">Coil</option></select></label>
    <label>Mode <select id="mode"><option value="duel">CPU Duel</option><option value="formation">Sentry Formation</option><option value="survival">Survival</option></select></label>
    <label id="formation" hidden>Sentries <select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <button>Start Battle</button>
  </form>
  <canvas width="576" height="246" role="img" aria-label="Six-column, three-row battlefield"></canvas>
  <p id="status" aria-live="polite"></p>
  <footer aria-label="Battle controls">
    <div class="directions">
      <button data-action="left" aria-label="Move left">←</button>
      <button data-action="up" aria-label="Move up">↑</button>
      <button data-action="down" aria-label="Move down">↓</button>
      <button data-action="right" aria-label="Move right">→</button>
    </div>
    <div class="actions">
      <button data-action="fire">Pulse</button>
      <button data-action="heavy">Heavy Pulse</button>
      <button id="pause" type="button">Pause</button>
    </div>
  </footer>
  <p><small>Keyboard · Arrow keys to move, Z for Pulse, X for Heavy Pulse.</small></p>
</main>
<script type="module" src="./client.mjs"></script>
</html>
